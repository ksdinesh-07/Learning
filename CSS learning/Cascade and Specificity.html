<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascade</title>
</head>
<body>

    <!-- have the same specificity -->
    <p>Hello World</p>

    <!-- Element vs Class -->
    <p class="text">Hello World</p>

    <!-- Class vs ID -->
     <p id="message" class="text"> Hello World </p>
    
    <!-- Element vs Class vs ID -->
     <p id="message" class="text"> Which color will win? </p>

    <!-- !important -->
     <p id="message"> Hello World </p>


</body>
</html>
