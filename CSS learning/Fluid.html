<body>
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Responsive Product Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="products">
        <h1>Our Products</h1>

        <div class="product-grid">

            <article class="product-card">
                
                <div class="product-image">
                    <img
                        src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
                        alt="White T-Shirt"
                    >
                    <span class="badge">NEW</span>
                </div>

                <div class="product-info">
                    <h2>Classic White T-Shirt</h2>
                    <p>
                        Comfortable cotton T-shirt
                        for everyday wear.
                    </p>
                    <p class="price">₹799</p>
                    <button>
                        Add to Cart
                    </button>
                </div>

            </article>


            <article class="product-card">

                <div class="product-image">
                    <img
                        src="https://images.unsplash.com/photo-1503341504253-dff4815485f1"
                        alt="Casual Fashion"
                    >
                    <span class="badge">NEW</span>
                </div>

                <div class="product-info">
                    <h2>Casual Fashion Top</h2>
                    <p>
                        Simple and stylish outfit
                        for everyday use.
                    </p>
                    <p class="price">₹999</p>
                    <button>
                        Add to Cart
                    </button>
                </div>

            </article>

        </div>

    </main>

</body>

</html>
</body>
</html>
