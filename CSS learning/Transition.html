<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perspective Practice</title>

    <style>

        .container {
            width: 300px;
            height: 300px;
            margin: 100px auto;
            border: 2px solid black;

            perspective: 500px;
        }

        .box {
            width: 200px;
            height: 200px;
            margin: 50px;

            background-color: skyblue;

            transform: rotateY(45deg);
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box">
            Product
        </div>

    </div>

</body>
</html>
