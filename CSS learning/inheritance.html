<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inheritance</title>
</head>
<body>

    <div>
        <h1>Hello</h1>
        <p>This is a paragraph.</p>
    </div>

    
    <!-- child can over write the value -->
    <div>
        <h1>Hello</h1>
        <p>This is a paragraph.</p>
    </div>
    
<!-- Child Can Override Inherited Value -->
    <div>
        <h1>Hello</h1>
        <p>This is a paragraph.</p>
    </div>

    <!-- Property That Does Not Inherit -->
    <div>
        <p>This paragraph does not get the border.</p>
    </div>

    <!-- Using inherit -->
    <div>
        <p>This paragraph inherits the color.</p>
    </div>

</body>
</html>
