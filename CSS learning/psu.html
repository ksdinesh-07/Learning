<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sticky Practice</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;

            position: sticky;
            top: 0;
        }

        .content {
            padding: 20px;
        }

        .box {
            height: 300px;
            background-color: lightgray;
            margin-bottom: 20px;
            padding: 20px;
        }

    </style>
</head>

<body>

    <div class="header">
        Litorox Header
    </div>

    <div class="content">

        <div class="box">
            <h2>Section 1</h2>
            <p>Scroll down to see what happens to the header.</p>
        </div>

        <div class="box">
            <h2>Section 2</h2>
            <p>The header should remain at the top.</p>
        </div>

        <div class="box">
            <h2>Section 3</h2>
            <p>Continue scrolling.</p>
        </div>

        <div class="box">
            <h2>Section 4</h2>
            <p>The header is sticky.</p>
        </div>

    </div>

</body>
</html>
