<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="selector.css">
</head>
<body>

    <!-- universal selector -->
    <h1 id="title">Hello</h1>
    <p class="text">Welcome</p>
    <div>Content</div>
    <hr>

    <!-- Element selectors -->
     <h1>Hello</h1>
     <p>Paragraph 1</p>
     <p>Paragraph 2</p>
     <div>Div Content</div>
     <hr>

     <!-- class selector -->
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div>Box 3</div>
    <hr>

    <!-- ID selector -->
    <h1 id="heading">Hello World</h1> 
    <h1>Another Heading</h1>
    <hr>

    <!-- attribute selector -->
    <input type="text" required>
    <input type="text">
    <hr>

    <!-- Grouping Selector -->
     <h1>Heading 1</h1>
     <h2>Heading 2</h2>
     <h3>Heading 3</h3>
     <hr>

     <!-- descendant Selector -->
    <div>
        <p>Para 1</p>
        <section>
            <p>para 2</p>
        </section>
    </div>
    <p>para 3</p>
    <hr>

    <!-- child Selector -->
     <div>
        <p>para 1</p>
        <section>
            <p>para 2</p>
        </section>
     </div>

     <!-- Adjacent sibling A+B -->
     <h1>Heading 1</h1>
     <p>para 1</p>
     <p>para 2</p>

    <!-- General sibling A~B -->
    <h1>Heading</h1> 
    <p>Para 1</p>
    <p>Para 2</p>
    <p>para 3</p>

     <!-- pseudo class -->
      <button>Move mouse</button>



</body>
</html>
