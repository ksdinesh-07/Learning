<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex</title>
    
    <style>
        div{
            display: flex;
            background:rgb(208, 174, 110);
            padding: 10px;
        }

        .one{
            background-color: aliceblue;
            padding: 10px;
            margin: 2px;
            flex-grow: 1;

        }

        .two{
            background: #000;
            color: antiquewhite;
            padding: 5px;
            margin: 2px;
            flex-grow: 1;
        }

    </style>

</head>
<body>
    
    <div>
        <h1 class="one">one</h1>
        <h1 class="two">two</h1>
    </div>
    
</body>
</html>
