<!DOCTYPE html>
<html lang="en">
<head>

    <title>Transition and Animation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- Transition Example -->
    <section class="demo">

        <h2>1. Transition</h2>

        <button class="transition-button">
            Hover

    <!-- Animation Example -->

        <div class="loader"></div>

    </section>
