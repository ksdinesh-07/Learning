<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units</title>
    <link rel="stylesheet" href="units.css">
</head>
<body>
    
    <div class="box">
        300px * 150px
    </div>

    <br>

    <div class="parent">
        <div class="child">
            50%
        </div>
    </div>
    <br>

    <!-- 2em = 2 * 20px = 40px -->
    <div class="par">
        <p class="ch">Hello World</p>
    </div>


    <!-- rem — Root em -->
    <h1>Hello World</h1>
    <p>This is a paragraph.</p>

    <!-- vw -->
     <div class="box1">
        50vw
    </div>

    <!-- vh -->
     <div class="box2">
        50vh
    </div>

    
</body>
</html>
