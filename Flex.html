<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>

        h1{
            background-color: rgb(61, 69, 69);
            color: aliceblue;
            margin: 2px;
            padding: 5px;

        }

        div{
            display: flex;
            background-color: blanchedalmond; 
            padding: 10px;
            justify-content: space-around;

        }


    </style>
</head>
<body>

    <div>
        <h1>one</h1>
        <h1>two</h1>
        <h1>three</h1>
    </div>   

</body>
</html>
