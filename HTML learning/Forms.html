<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms  Practise</title>

</head>
<body>

    <section id="forms">
            <h2>HTML Forms</h2>

            
            <!-- post  -->
            <form  method="post">
                    <label for="link" >ID:</label>
                    <input type="text" id="link" id="ID">
                    <button type="submit">Submit</button>
            </form>

           

            <!-- action = other file -->
             <form  action="../personal-profile/about.html" method="get">
                    <label for="name" >Name:</label>
                    <input type="text" id="name" name="name">
                    <button type="submit">Submit</button>
            </form> 



            <hr>
            
        
            <form method="get" action="../personal-profile/contact.html">



                    <label for="name" >Name:</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        placeholder="enter your name">

                    <br><br>

                    <!--email-->

                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                    <br><br>

                    <button type="submit">
                        Submit
                    </button>
            
                    </form>



    </section>


    <form action="index.html" method="get" target="_self">

        <label for="name">fname:</label>

        <input
            type="text"
            id="name"
            name="name"
            required>

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

    <!--autocomplete-->

    <form
        action="index.html"
        method="get"
        autocomplete="on">

        <label for="name">Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required>

        <br><br>

        <label for="email">Autocomplete off:</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <button type="submit">
            Submit
        </button>

        <!--novalidate-->

    </form>

        <form
        action="index.html"
        method="get" 
        novalidate>

        <br><br>

        <label for="email">novalidate:</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

    <hr>

    <!-- Type attributes -->

    <!-- text -->
     <label for="name">Name:</label>

    <input
        type="text"
        id="name"
        name="name">

    <!-- email -->

    <label for="email">Email:</label>

    <input
        type="email"
        id="email"
        name="email">
    
    <!-- number -->
    
    <label for="age">Age:</label>

    <input
        type="number"
        id="age"
        name="age">

    <!-- radio -->
    <p>Gender</p>
    <input type="radio" id="male" name="gender" value="male" >  
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>

    <br><br>


    <!-- checkbox -->
    <input type="checkbox" id="html" name="skills" value="html">
    <label for="html">HTML</label>

    <input type="checkbox" id="css" name="skills" value="css">
    <label for="css">CSS</label> 

    <input type="checkbox" id="javascript" name="skills" value="js">
    <label for="js">JS</label>

    <br><br>
    <!-- password -->
    <label for="password">Password:</label>

    <input
        type="password"
        id="password"
        name="password">

    <br><br>

    <!-- date -->
    <label for="dob">Date of Birth</label>
    <input 
        type="date"
        id="dob"
        name="dob">

        
    <br><br>

    <!-- time -->
    <label for="time">Time</label>
    <input 
        type="time"
        id="time"
        name="time">

    <br><br>

        <!-- date time -->
    <label for="date-time">Date- Time</label>
    <input 
        type="datetime-local"
        id="date-time"
        name="d-time">

    <br><br>

    <!-- file type -->

    <label for="file-type">upload file</label>
    <input 
        type="file"
        id="file-type"
        name="file">

    <br><br>

    <!-- color -->

    <label for="color">choose a color</label>
    <input 
        type="color"
        id="color"
        name="color">

    <br><br>

    <!-- range -->

    <label for="range">Volume</label>
    <input 
        type="range"
        id="range"
        name="range"
        min="0"
        max="10"
        step="2">

    <br><br>

    <!-- search -->

    <label for="search">search</label>
    <input 
        type="search"
        id="search"
        name="q">

    <br><br>

    <!-- tel -->

    <label for="tel">phone</label>
    <input 
        type="tel"
        id="tel"
        name="phone">

    <br><br>

    <!-- url -->

    <label for="web">url</label>
    <input 
        type="url"
        id="web"
        name="website">

    <br><br>

    <!-- hidden -->

    <input 
        type="hidden"
        name="phone"
        value="2">

    <br><br>

    <input 
        type="submit"
        value="register">
         







    

    

    






</body>
</html>
