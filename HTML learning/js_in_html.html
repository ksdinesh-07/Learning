<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JavaScript Example</title>
</head>

<body>

    <h1 id="title">My Portfolio</h1>

    <p id="message">Hello!</p>

    <button onclick="changeMessage()">
        Click Me
    </button>

    <script>
        function changeMessage() {
            document.getElementById("message").textContent =
                "Welcome to my portfolio!";
        }
    </script>

</body>

</html>
