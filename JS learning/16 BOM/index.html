<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exam</title>
    <script src="bom.js" defer></script>
</head>

    <body>

        <h1>Online Exam</h1>
        <p id="student_name">Student: Not Started</p>
        <p id="exam_status">Exam Status: Not Started</p>

        <hr>

        <button id="instructions_button">
            Exam Instructions
        </button>

        <button id="start_button">
            Start Exam
        </button>

        <button id="submit_button">
            Submit Exam
        </button>

        <button id="print_button">
            Print Result
        </button>

        <button id="back_button">
            Go Back
        </button>

        <hr>

        <h2>Browser Information</h2>
        <p id="browser_info"></p>
        <h2>Exam Information</h2>
        <p id="exam_info"></p>

    </body>

</html>
