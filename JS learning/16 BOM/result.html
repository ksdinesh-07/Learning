<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Exam Result</title>
    <script src="result.js" defer></script>
</head>

<body>
    <h1>Exam Result</h1>
    <p id="studentName"></p>
    <p id="examStatus">
        Exam Status: Submitted
    </p>
    <hr>

    <h2>Result</h2>
    <p>Total Questions: 2</p>
    <p>Correct Answers: 2</p>
    <p>Score: 100 / 100</p>

    <button onclick="window.print()">
        Print Result
    </button>
    <br><br>

    <h2>Score Visualization</h2>
    <canvas id="score_canvas" width="400" height="200"></canvas>

    <h2>Performance</h2>
    <canvas id="performance_canvas" width="400" height="200"></canvas>

    <h2>Exam Status</h2>
    <canvas id="status_canvas" width="400" height="150"></canvas>

    <button onclick="history.back()">
        Go Back
    </button>

    <button onclick="location.href='index.html'">
        Home
    </button>

</body>

</html>
