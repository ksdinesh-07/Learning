<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application</title>
    <script src="regEx.js" defer></script>
</head>

<body>
    <h1>Job Application</h1>
    <input
        type="text"
        id="email"
        placeholder="Enter email"
    >
    <input
        type="text"
        id="phone"
        placeholder="Enter phone number"
    >
    <textarea
        id="resume"
        placeholder="Enter resume text"
    ></textarea>

    <button id="validate">
        Validate Application
    </button>

    <p id="result"></p>

</body>
</html>
