<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Runtime</title>
    <script src="event_loop.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .exam {
            width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        #timer {
            font-size: 30px;
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
        }
    </style>

</head>

<body>

    <div class="exam">

        <h1>Online Exam</h1>

        <p>
            What is the output of:
        </p>

        <p>
            <strong>2 + 3</strong>
        </p>

        <button id="answer">
            Answer: 5
        </button>

        <div id="timer">
            Time: 10
        </div>

        <div id="result">
            Waiting for answer...
        </div>

    </div>


</body>

</html>
