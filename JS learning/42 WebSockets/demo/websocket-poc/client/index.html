<!DOCTYPE html>
<html>
<head>
    <title>WebSocket POC</title>
</head>
<body>

    <h1>Native WebSocket POC</h1>

    <p id="connection_status">Connecting...</p>

    <input
        id="message_input"
        placeholder="Enter message"
    >

    <button id="send_button">
        Send Message
    </button>

    <button id="disconnect_button">
        Disconnect
    </button>

    <h2>Messages</h2>

    <div id="messages"></div>

    <script src="app.js"></script>

</body>
</html>
