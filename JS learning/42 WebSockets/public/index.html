<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Realtime Chat</title>
    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>
<body>
    <div class="chat_container">
        <h1>Realtime Chat</h1>
        <p>
            Online Users:
            <strong id="online_users">0</strong>
        </p>
        <div
            id="message_list"
            class="message_list"
        ></div>
        <div class="message_form">
            <input
                type="text"
                id="user_name"
                placeholder="Enter your name"
            >
            <input
                type="text"
                id="message_input"
                placeholder="Enter your message"
            >
            <button id="send_button">
                Send
            </button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="./app.js"></script>
</body>
</html>
