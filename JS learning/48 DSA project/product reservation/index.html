
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Reservation Conflict Detector</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Inventory Reservation Conflict Detector</h1>
        <p>Check whether active orders exceed available product stock.</p>

        <section class="panel">
            <h2>Product Details</h2>

            <label for="product_id">Select Product</label>
            <select id="product_id">
                <option value="P101">P101</option>
                <option value="P102">P102</option>
                <option value="P103">P103</option>
                <option value="P104">P104</option>
            </select>

            <label for="warehouse_id">Warehouse ID</label>
            <input id="warehouse_id" type="text" readonly>

            <label for="available_stock">Available Stock</label>
            <input id="available_stock" type="number" min="0" step="1">

            <button id="check_button" type="button">
                Check Reservations
            </button>
        </section>

        <section class="panel">
            <h2>Product Orders</h2>
            <div id="orders"></div>
        </section>

        <section class="panel">
            <h2>Reservation Result</h2>
            <div id="result">
                Select a product and check its reservations.
            </div>
        </section>
    </main>
</body>
</html>
