<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Online Exam</title>
    <script src="exam.js" defer></script>
</head>

<body>

    <h1>JavaScript BOM Exam</h1>
    <p id="student_name"></p>
    <hr>

    <h2>Question 1</h2>
    <p>Which object represents the browser window?</p>

    <label>
        <input type="radio" name="q1" value="window">
        window
    </label>
    <br>

    <label>
        <input type="radio" name="q1" value="document">
        document
    </label>
    <br>

    <label>
        <input type="radio" name="q1" value="screen">
        screen
    </label>
    <hr>

    <h2>Question 2</h2>

    <p>Which BOM property gives the browser viewport width?</p>

    <label>
        <input type="radio" name="q2" value="innerWidth">
        window.innerWidth
    </label>
    <br>

    <label>
        <input type="radio" name="q2" value="screen">
        screen.width
    </label>
    <br>

    <label>
        <input type="radio" name="q2" value="location">
        location.href
    </label>
    <hr>

    <button id="submit_button">
        Submit Exam
    </button>

</body>

</html>
