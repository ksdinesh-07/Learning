<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="todo_app">
        <h1>Todo App</h1>
        <form id="todo_form">
            <input
                type="text"
                id="todo_input"
                placeholder="Enter a task"
                autocomplete="off"
            >
            <button type="submit">Add</button>
        </form>
        <ul id="todo_list"></ul>
    </main>
    <script src="./todo.js"></script>
</body>
</html>
