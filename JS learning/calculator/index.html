<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="calculator">

        <div class="display">
            <div id="previous_display"></div>
            <div id="current_display">0</div>
        </div>

        <div class="buttons">

            <button class="action_button" data-action="clear">AC</button>
            <button class="action_button" data-action="delete">DEL</button>
            <button class="action_button" data-action="percentage">%</button>
            <button class="operator_button" data-operation="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator_button" data-operation="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator_button" data-operation="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator_button" data-operation="+">+</button>

            <button data-action="sign">+/-</button>
            <button class="zero_button" data-number="0">0</button>
            <button data-action="decimal">.</button>

            <button class="equals_button" data-action="equals">=</button>

        </div>

    </div>

    <script src="./calculator.js"></script>
</body>
</html>
