<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web socket client</title>
    <script>
        let socket=new WebSocket("ws://localhost:8080");

        socket.onopen=function(event){

        }

        function display_message(message,sender){
            const message_container=document.getElementById("message");
            const message_element=document.createElement('div');
            message_element.classList.add('message');
            message_element.classList.add(sender==='client'? "client-message" : "server-message");
            message_element.textContent=message;

            const messsage_wrapper=document.createElement('div');
            messsage_wrapper.classList.add("message-container");
            messsage_wrapper.appendChild(message_element);
            message_container.appendChild(messsage_wrapper);
            message_container.scrollTop=message_container.scrollHeight;
        }

        function send_message(){
            let message=document.getElementById("message_input").value;
            if (message.trim()!==""){
                socket.send(message);
                display_message(message,"client");
                document.getElementById('message_input').value="";
            }
        }
    </script>
</head>
<body>
    <h1>Websocket caht client</h1>
    <div id="messages"></div>

    <input type="text" id="message_input" placeholder="Enter your message">
    <button onclick="send_message()">send</button>
</body>
</html>
