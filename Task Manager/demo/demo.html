<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks - Task & Habit Tracker</title>

    <link rel="stylesheet" href="demo.css">
</head>

<body>

    <main class="page-container">

        <div id="header"></div>

        <!-- Task Filters -->
        <section class="task-filters">

            <div class="filter-left">

                <div class="filter-title">
                    <img src="./assets/Filter_icon.svg" alt="">
                    <span>Filters:</span>
                </div>

                <select class="filter-select" id="status-filter">
                    <option value="all">All status</option>
                    <option value="todo">Todo</option>
                    <option value="in-progress">In progress</option>
                    <option value="on-hold">On hold</option>
                    <option value="completed">Completed</option>
                </select>

                <select class="filter-select" id="priority-filter">
                    <option value="all">All priority</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>

            </div>

            <div class="filter-right">

                <div class="sort-label">
                    <img src="./assets/Sort_icon.svg" alt="">
                    <span>Sort by:</span>
                </div>

                <select class="filter-select sort-select" id="sort-filter">
                    <option value="due-date">Due date</option>
                    <option value="priority">Priority</option>
                    <option value="created-at">Created at</option>
                    <option value="ascending">Ascending</option>
                    <option value="descending">Descending</option>
                </select>

            </div>

        </section>


        <!-- Task Toolbar -->
        <section class="task-toolbar">

            <h2 class="task-heading">Tasks</h2>

            <div class="task-actions">

                <div class="search-box">

                    <img src="./assets/search_icon.svg" alt="">

                    <input
                        type="text"
                        id="task-search"
                        placeholder="Search"
                        aria-label="Search tasks"
                    >

                </div>

                <button class="add-task-button" type="button">

                    <img src="./assets/add_icon.svg" alt="">

                    <span>Add task</span>

                </button>

            </div>

        </section>


        <!-- Empty Task State -->
        <section class="empty-task-state" id="empty-task-state">

            <img
                class="empty-task-icon"
                src="./assets/clipboard_icon.svg"
                alt="No tasks"
            >

            <p class="empty-task-message">
                No tasks found. Create your first task to get started!
            </p>

        </section>


        <!-- Task List -->
        <section class="task-list" id="task-list"></section>

    </main>


    <!-- Add Task Modal -->
    <div class="add_model_overlay" id="add_task_page">

        <div class="add_task_page">

            <!-- Modal Header -->
            <div class="task_header">

                <div>

                    <h2>Add task</h2>

                    <p>
                        Add a new task with details, priority, and due date.
                    </p>

                </div>

                <button
                    class="modal-close-button"
                    id="close-task-modal"
                    type="button"
                    aria-label="Close"
                >

                    <img src="./assets/close_icon.svg" alt="Close">

                </button>

            </div>


            <!-- Add Task Form -->
            <form id="add_task_form" novalidate>

                <!-- Task Title -->
                <div class="form_group">

                    <input
                        type="text"
                        id="task-title"
                        name="task_title"
                        placeholder="Task title"
                        required
                    >

                    <label class="floating_label" for="task-title">
                        Task title
                        <span class="required_star">*</span>
                    </label>

                    <span class="error_text">
                        Please fill the field
                    </span>

                </div>


                <!-- Description -->
                <div class="form_group">

                    <textarea
                        id="task-description"
                        name="task_description"
                        placeholder="Description"
                    ></textarea>

                    <label class="floating_label" for="task-description">
                        Description
                    </label>

                </div>


                <!-- Due Date -->
                <div class="form_group date_input_wrapper">

                    <input
                        type="text"
                        id="task-due-date"
                        name="due_date"
                        placeholder="Due date"
                        required
                    >

                    <label class="floating_label" for="task-due-date">
                        Due date
                        <span class="required_star">*</span>
                    </label>

                    <button
                        type="button"
                        class="date_icon"
                        id="date-icon"
                        aria-label="Select due date"
                    >
                        <img src="./assets/due_date_icon.svg" alt="">
                    </button>

                    <span class="error_text">
                        Please fill the field
                    </span>

                </div>


                <!-- Priority -->
                <div class="form_group">

                    <select id="task-priority" name="priority" required>

                        <option value="" disabled selected hidden></option>

                        <option value="high">High</option>

                        <option value="medium">Medium</option>

                        <option value="low">Low</option>

                    </select>

                    <label class="floating_label" for="task-priority">
                        Priority
                        <span class="required_star">*</span>
                    </label>

                    <div class="select_arrow">
                        <img src="./assets/markdown_icon.svg" alt="">
                    </div>

                    <span class="error_text">
                        Please fill the field
                    </span>

                </div>


                <!-- Status (defaults to Todo) -->
                <div class="form_group">

                    <select id="task-status" name="status" required>

                        <option value="todo" selected>Todo</option>

                        <option value="in-progress">In Progress</option>

                        <option value="completed">Completed</option>

                    </select>

                    <label class="floating_label" for="task-status">
                        Status
                        <span class="required_star">*</span>
                    </label>

                    <div class="select_arrow">
                        <img src="./assets/markdown_icon.svg" alt="">
                    </div>

                    <span class="error_text">
                        Please fill the field
                    </span>

                </div>


                <!-- Modal Footer -->
                <div class="add_task_footer">

                    <button
                        class="cancel-button"
                        id="cancel-task-modal"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button class="submit-button" type="submit">
                        Submit
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JavaScript -->
    <script type="module">

        import {
            render_header,
            setup_theme
        } from "./js/components/header.js";

        import {
            setup_task_modal
        } from "demo.js";


        document.getElementById("header").innerHTML =
            render_header("tasks");

        setup_theme();

        setup_task_modal();

    </script>

</body>

</html>
