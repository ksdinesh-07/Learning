<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Task & Habit Tracker</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="page-container">

        <!-- Header -->
        <div id="header"></div>

        <!-- Task filters -->
        <section class="task-filters">

            <div class="filter-left">

                <div class="filter-title">
                    <img src="./assets/Filter_icon.svg" alt="">
                    <span>Filters:</span>
                </div>

                <select class="filter-select" id="status-filter">
                    <option value="all">All status</option>
                    <option value="todo">Todo</option>
                    <option value="in-progress">In progress</option>
                    <option value="done">Completed</option>
                </select>

                <select class="filter-select" id="priority-filter">
                    <option value="all">All priority</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>

            </div>

            <div class="filter-right">

                <div class="sort-label">
                    <img src="./assets/Sort_icon.svg" alt="">
                    <span>Sort by:</span>
                </div>

                <select class="filter-select sort-select" id="sort-filter">
                    <option value="manual" selected>Manual (drag order)</option>
                    <option value="due-date">Due date</option>
                    <option value="priority">Priority</option>
                    <option value="created-at">Created at</option>
                    <option value="ascending">Title: A to Z</option>
                    <option value="descending">Title: Z to A</option>
                </select>

            </div>

        </section>

        <!-- Task toolbar -->
        <section class="task-toolbar">

            <h2 class="task-heading">Tasks</h2>

            <div class="task-actions">

                <div class="search-box">
                    <img src="./assets/search_icon.svg" alt="">
                    <input type="search" id="task-search" placeholder="Search" aria-label="Search tasks">
                </div>

                <button class="add-task-button" type="button">
                    <img src="./assets/add_icon.svg" alt="">
                    <span>Add task</span>
                </button>

            </div>

        </section>

        <!-- Empty state -->
        <section class="empty-task-state" id="empty-task-state" aria-live="polite">
            <img class="empty-task-icon" src="./assets/clipboard_icon.svg" alt="">

            <p class="empty-task-message">
                No tasks found. Create your first task to get started!
            </p>

        </section>

        <!-- Saved tasks are rendered here -->
        <section class="task-list" id="task-list" aria-label="Task list"></section>

    </main>

    <!-- Add task modal overlay -->
    <div class="add_model_overlay" id="add_task_page" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">

        <div class="add_task_page">

            <!-- Modal header -->
            <div class="task_header">

                <div>
                    <h2 id="task-modal-title">Add task</h2>

                    <p>
                        Add a new task with details, priority, and due date.
                    </p>
                </div>

                <button class="modal-close-button" id="close-task-modal" type="button" aria-label="Close">
                    <img src="./assets/close_icon.svg" alt="">
                </button>

            </div>

            <!-- Task form -->
            <form id="add_task_form" novalidate>

                <!-- Task title -->
                <div class="form_group">

                    <input type="text" id="task-title" name="task_title" placeholder=" " required>

                    <label class="floating_label" for="task-title">
                        Task title
                        <span class="required_star">*</span>
                    </label>

                    <span class="error_text">
                        Please fill the field
                    </span>

                </div>

                <!-- Description -->
                <div class="form_group">

                    <textarea id="task-description" name="task_description" placeholder=" " rows="3"></textarea>

                    <label class="floating_label" for="task-description">
                        Description
                    </label>

                </div>

                <!-- Due date -->
                <div class="form_group date_input_wrapper">

                    <input type="date" id="task-due-date" name="due_date" required>

                    <label class="floating_label" for="task-due-date">
                        Due date
                        <span class="required_star">*</span>
                    </label>

                    <button type="button" class="date_icon" id="date-icon" aria-label="Select due date">
                        <img src="./assets/due_date_icon.svg" alt="">
                    </button>

                    <span class="error_text">
                        Please fill the field
                    </span>

                </div>

                <!-- Priority -->
                <div class="form_group">

                    <select id="task-priority" name="priority" required>
                        <option value="" disabled selected hidden></option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>

                    <label class="floating_label" for="task-priority">
                        Priority
                        <span class="required_star">*</span>
                    </label>

                    <div class="select_arrow">
                        <img src="./assets/markdown_icon.svg" alt="">
                    </div>

                    <span class="error_text">
                        Please select a priority
                    </span>

                </div>

                <!-- Status -->
                <div class="form_group">

                    <select id="task-status" name="status" required>
                        <option value="todo" selected>Todo</option>
                        <option value="in-progress">In Progress</option>
                        <option value="done">Completed</option>
                    </select>

                    <label class="floating_label" for="task-status">
                        Status
                        <span class="required_star">*</span>
                    </label>

                    <div class="select_arrow">
                        <img src="./assets/markdown_icon.svg" alt="">
                    </div>

                </div>

                <!-- Modal footer -->
                <div class="add_task_footer">

                    <button class="cancel-button" id="cancel-task-modal" type="button">
                        Cancel
                    </button>

                    <button class="submit-button" type="submit">
                        Submit
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Delete Confirmation Modal -->

    <div id="delete-confirm-modal" class="modal-overlay" style="display: none;">
        <div class="delete-modal">
            <div class="delete-modal-header">
                <h3>Delete</h3>
                <button type="button" id="delete-modal-close" class="modal-close">&times;</button>
            </div>

            <div class="delete-modal-body">
                <p id="delete-confirm-message"></p>
            </div>

            <div class="delete-modal-footer">
                <button type="button" id="delete-cancel-btn" class="cancel-btn">
                    Cancel
                </button>
                <button type="button" id="delete-confirm-btn" class="confirm-delete-btn">
                    Delete
                </button>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script type="module">

        import { render_header, setup_theme } from "./js/components/header.js";
        import { setup_task_modal } from "./js/task.js";

        document.getElementById("header").innerHTML = render_header("tasks");

        setup_theme();
        setup_task_modal();

        // Open the native date picker
        const task_due_date = document.getElementById("task-due-date");
        const date_icon = document.getElementById("date-icon");

        date_icon.addEventListener("click", () => {
            if (typeof task_due_date.showPicker === "function") {
                task_due_date.showPicker();
            } else {
                task_due_date.focus();
            }
        });

    </script>

</body>

</html>
