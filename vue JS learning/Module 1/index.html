<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue js</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">
        <header>
            <span>Hello</span>
        </header>

        <main>
            <h1>hi,{{name}}</h1>
            <p>I am a student at Esec</p>
        </main>

        <footer>
            <p>$copy; 2025</p>
        </footer>

    </div>
    
    <script>
        const {createApp,ref}=vue

        createApp({
            setup(){
                const name =ref('Arul')
                return {name}
            }
        }).mount('#app')

    </script>

</body>
</html>
